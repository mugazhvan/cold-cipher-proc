[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kisanflow-backend"
version = "0.1.0"
description = "FastAPI Backend for SIH26032 Agricultural Procurement & Queue Coordination"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.1",
    "fpdf2>=2.7.7",
    "qrcode[pil]>=7.4.2"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []
