services:
  - type: web
    name: kisanflow-backend
    env: docker
    region: singapore
    dockerfilePath: source/backend/Dockerfile
    dockerContext: source/backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kisanflow-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DEBUG
        value: "False"

databases:
  - name: kisanflow-db
    plan: free
    region: singapore
    databaseName: kisanflow
    user: postgres
